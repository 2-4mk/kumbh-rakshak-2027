<style>
#cloudStatusBadge{position:fixed;left:14px;bottom:14px;z-index:9999;padding:8px 13px;border-radius:20px;font-size:12px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.2);display:flex;align-items:center;gap:6px}
#cloudStatusBadge.connecting{background:#fff5d7;color:#8a6d00}
#cloudStatusBadge.connected{background:#e7f6eb;color:#146a2a}
#cloudStatusBadge.failed{background:#ffebeb;color:#9e1515;cursor:pointer}
.pending-sync-tag{display:inline-block;background:#fff5d7;color:#8a6d00;font-size:11px;padding:3px 8px;border-radius:10px;margin-left:6px}
</style>
<div id="cloudStatusBadge" class="connecting">🟡 Connecting to cloud...</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
<script>
/* ============================================================
   KUMBH RAKSHAK - FIREBASE VOLUNTEER SYNC (fixed)
   Adds: visible status badge, write timeout, local retry queue.
   ============================================================ */
const firebaseConfig = {
   apiKey: "AIzaSyBH4Pp6SAgOA4Hb6qdj5ek_6Bc6PYrJHY8",
  authDomain: "kumbh-rakshak-2027.firebaseapp.com",
  projectId: "kumbh-rakshak-2027",
  storageBucket: "kumbh-rakshak-2027.firebasestorage.app",
  messagingSenderId: "324441370677",
  appId: "1:324441370677:web:26186f93629787429fc17c"
};

(function () {
  const badge = document.getElementById('cloudStatusBadge');
  function setBadge(state, text){
    badge.className = state;
    badge.textContent = (state==='connecting'?'🟡 ':state==='connected'?'🟢 ':'🔴 ') + text;
  }

  // Looser but still meaningful sanity check on the config values.
  const looksReal = firebaseConfig.apiKey && firebaseConfig.apiKey.length > 20
    && !firebaseConfig.apiKey.includes('PASTE_YOUR')
    && firebaseConfig.projectId && !firebaseConfig.projectId.includes('PASTE_YOUR');

  if (!looksReal) {
    setBadge('failed', 'Firebase config not set — tap for details');
    badge.onclick = () => alert('firebaseConfig still has placeholder values. Paste your real config from Firebase Console > Project Settings before deploying.');
    console.error('Firebase config looks like a placeholder.');
    return;
  }

  try {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  } catch (e) {
    setBadge('failed', 'Firebase init failed — tap for details');
    badge.onclick = () => alert('Firebase initialization error:\n' + e.message);
    console.error('Firebase initialization failed:', e);
    return;
  }

  const db = firebase.firestore();
  const appsRef = db.collection('kumbhVolunteerApplications');
  const storage = firebase.storage();
  window.kumbhDB = db;
  window.kumbhFirebaseReady = false;

  // Local queue for anything that failed/timed out — nothing is ever silently lost.
  function getPendingQueue(){ try{return JSON.parse(localStorage.getItem('kumbhPendingApplications')||'[]');}catch(e){return [];} }
  function savePendingQueue(q){ localStorage.setItem('kumbhPendingApplications', JSON.stringify(q)); }

  function withTimeout(promise, ms, label){
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error((label||'Operation') + ' timed out after ' + (ms/1000) + 's — check your internet connection and Firestore security rules.')), ms))
    ]);
  }

  function safeLocalSave(){ try{ localStorage.setItem('kumbhVolunteerApplications', JSON.stringify(window.volunteerApplications||[])); }catch(e){} }
  function refreshViews(){
    safeLocalSave();
    try{ if(typeof renderVolunteerApplicationsAdmin==='function') renderVolunteerApplicationsAdmin(); }catch(e){ console.error('Admin render error:', e); }
    try{ if(typeof renderAccountPanel==='function') renderAccountPanel(); }catch(e){}
    try{ if(typeof refreshAccountCorner==='function') refreshAccountCorner(); }catch(e){}
  }

  let connectFailTimer = setTimeout(() => {
    if (!window.kumbhFirebaseReady) {
      setBadge('failed', 'No response from cloud — tap for details');
      badge.onclick = () => alert(
        'Firebase has not responded in 10 seconds.\n\nMost likely causes:\n' +
        '1) Firestore security rules are blocking reads (check Firebase Console > Firestore > Rules)\n' +
        '2) This domain is not in Firebase Console > Authentication > Settings > Authorized domains\n' +
        '3) No internet connection\n\n' +
        'Any volunteer applications submitted while offline are saved locally and will sync automatically once this is fixed.'
      );
    }
  }, 10000);

  appsRef.onSnapshot(
    (snapshot) => {
      clearTimeout(connectFailTimer);
      const list = snapshot.docs.map(doc => Object.assign({id: doc.id}, doc.data()));
      list.sort((a,b) => {
        const ta = a.createdAt?.toMillis ? a.createdAt.toMillis() : (Date.parse(a.appliedAt||'')||0);
        const tb = b.createdAt?.toMillis ? b.createdAt.toMillis() : (Date.parse(b.appliedAt||'')||0);
        return tb - ta;
      });
      if (typeof volunteerApplications !== 'undefined') volunteerApplications = list;
      window.volunteerApplications = list;
      window.kumbhFirebaseReady = true;
      setBadge('connected', 'Cloud connected · ' + list.length + ' application(s)');
      refreshViews();
    },
    (error) => {
      clearTimeout(connectFailTimer);
      window.kumbhFirebaseReady = false;
      setBadge('failed', 'Cloud sync error — tap for details');
      badge.onclick = () => alert('Firestore listener error:\n' + (error.message || error) + '\n\nCheck your Firestore security rules — they likely require request.auth != null but this app does not sign users into Firebase Auth.');
      console.error('Firestore listener error:', error);
    }
  );

  async function cloudAdd(data){
    const payload = Object.assign({}, data, {
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    delete payload.id;
    const ref = await withTimeout(appsRef.add(payload), 12000, 'Saving application');
    return ref.id;
  }
  async function cloudUpdate(id, changes){
    await withTimeout(appsRef.doc(id).update(Object.assign({}, changes, {updatedAt: firebase.firestore.FieldValue.serverTimestamp()})), 12000, 'Updating application');
  }
  function blobFromDataURL(dataURL){
    const parts = String(dataURL).split(',');
    const match = parts[0].match(/data:([^;]+);base64/);
    const mime = match ? match[1] : 'image/jpeg';
    const raw = atob(parts[1]||'');
    const bytes = new Uint8Array(raw.length);
    for (let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
    return new Blob([bytes], {type: mime});
  }
  async function uploadFile(fileOrBlob, path, contentType){
    const ref = storage.ref().child(path);
    await withTimeout(ref.put(fileOrBlob, {contentType: contentType || fileOrBlob.type || 'application/octet-stream'}), 30000, 'Uploading file');
    return await ref.getDownloadURL();
  }

  /* ---------------- Submit application (with local fallback) ---------------- */
  window.submitVolunteerApplicationV5 = async function () {
    const email = document.getElementById('v5Email')?.value.trim() || '';
    const phone = document.getElementById('v5Phone')?.value.trim() || '';
    const area = document.getElementById('v5Area')?.value.trim() || '';
    const reason = document.getElementById('v5Reason')?.value.trim() || '';
    const gov = document.getElementById('v5GovFile')?.files?.[0] || null;
    const govType = document.getElementById('v5GovType')?.value || '';
    const role = document.getElementById('v5Role')?.value || 'Ground Volunteer';
    const selfieData = window.v5Selfie || '';
    const loggedInUser = (typeof currentUser !== 'undefined') ? currentUser : window.currentUser;

    if (!loggedInUser) return alert('Please log in before submitting the volunteer application.');
    if (!email || !phone || !area || !reason || !govType || !gov || !selfieData)
      return alert('Please complete every required field, upload a Government ID and capture a live selfie.');

    const button = Array.from(document.querySelectorAll('#v5Modal button')).find(b => /SUBMIT FOR ADMIN APPROVAL|SAVING/.test(b.textContent||''));
    if (button){ button.disabled = true; button.textContent = 'SAVING APPLICATION...'; }

    const app = {
      userId: loggedInUser.id || '', name: loggedInUser.name || '', phone, email, area, role, reason,
      govType, govFileName: gov.name, status: 'PENDING', verificationStatus: 'UPLOADING',
      appliedAt: new Date().toLocaleString(), credentialsDelivered: false,
      volunteerId: '', tempId: '', tempPassword: '', firstLogin: false, mustChangePassword: false
    };

    try {
      const appId = await cloudAdd(app);
      loggedInUser.email = email; loggedInUser.phone = phone;
      try { localStorage.setItem('kumbhCurrentUser', JSON.stringify(loggedInUser)); } catch(e){}
      if (typeof stopSelfieV5 === 'function') stopSelfieV5();
      if (typeof closeV5Modal === 'function') closeV5Modal();
      alert('✓ Application submitted successfully.\n\nApplication ID: ' + appId + '\nVisible to Admin on all devices.');

      (async () => {
        try {
          const safeUser = String(loggedInUser.id||'user').replace(/[^a-zA-Z0-9_-]/g,'_');
          const stamp = Date.now();
          const safeGovName = gov.name.replace(/[^a-zA-Z0-9._-]/g,'_');
          const govPath = 'volunteer-verification/'+safeUser+'/'+stamp+'-government-id-'+safeGovName;
          const selfiePath = 'volunteer-verification/'+safeUser+'/'+stamp+'-live-selfie.jpg';
          const results = await Promise.all([
            uploadFile(gov, govPath, gov.type||'application/octet-stream'),
            uploadFile(blobFromDataURL(selfieData), selfiePath, 'image/jpeg')
          ]);
          await cloudUpdate(appId, {govUrl: results[0], selfieUrl: results[1], verificationStatus: 'READY'});
        } catch (uploadError) {
          console.error('Verification upload failed:', uploadError);
          try { await cloudUpdate(appId, {verificationStatus: 'UPLOAD_FAILED', verificationError: String(uploadError.message||uploadError)}); } catch(e){}
        }
      })();

    } catch (error) {
      console.error('Application submit error:', error);
      // FALLBACK: queue locally instead of losing the application.
      const queue = getPendingQueue();
      queue.push(Object.assign({localId: 'LOCAL'+Date.now()}, app));
      savePendingQueue(queue);
      if (button){ button.disabled = false; button.textContent = 'SUBMIT FOR ADMIN APPROVAL'; }
      alert('⚠️ Could not reach the cloud right now:\n' + (error.message||error) +
            '\n\nYour application has been saved on this device and will NOT be lost — ' +
            'it is queued and will sync automatically once the connection is fixed. ' +
            'You can also tap the status badge in the corner for troubleshooting steps.');
    }
  };

  /* Retry any locally-queued applications whenever we (re)connect. */
  async function retryPendingQueue(){
    const queue = getPendingQueue();
    if (!queue.length || !window.kumbhFirebaseReady) return;
    const remaining = [];
    for (const item of queue) {
      try { const {localId, ...data} = item; await cloudAdd(data); }
      catch(e){ remaining.push(item); }
    }
    savePendingQueue(remaining);
    if (remaining.length < queue.length) setBadge('connected', 'Cloud connected · synced ' + (queue.length-remaining.length) + ' queued item(s)');
  }
  setInterval(retryPendingQueue, 15000);

  /* ---------------- Approve / Reject ---------------- */
  window.krApproveVolunteer = async function (id) {
    const list = window.volunteerApplications || [];
    const app = list.find(x => x.id === id);
    if (!app) return alert('Application not found in the cloud database.');
    if (String(app.status).toUpperCase() !== 'PENDING') return alert('This application is already ' + app.status + '.');
    if (!confirm('Approve ' + (app.name||'this volunteer') + ' and issue a temporary Volunteer ID and password?')) return;

    const volunteerId = app.volunteerId || ('VOL' + Math.floor(100000+Math.random()*900000));
    const tempPassword = app.tempPassword || ('K' + Math.floor(1000+Math.random()*9000));

    try {
      await cloudUpdate(id, {
        status: 'APPROVED', volunteerId, tempId: volunteerId, tempPassword,
        firstLogin: true, mustChangePassword: true, credentialsDelivered: true,
        credentialsMessage: 'Approved on ' + new Date().toLocaleString() + '. Temporary credentials issued.'
      });
      alert('✓ Volunteer approved.\n\nVolunteer ID: ' + volunteerId + '\nTemporary Password: ' + tempPassword + '\n\nSynced to all devices.');
    } catch (error) {
      console.error('Approval error:', error);
      alert('❌ Approval failed: ' + (error.message||error) + '\n\nCheck your Firestore security rules.');
    }
  };
  window.krRejectVolunteer = async function (id) {
    const app = (window.volunteerApplications||[]).find(x => x.id === id);
    if (!app) return alert('Application not found in Firebase.');
    if (!confirm('Reject ' + (app.name||'this application') + '?')) return;
    try { await cloudUpdate(id, {status: 'REJECTED'}); alert('✓ Application rejected and synced to all devices.'); }
    catch (error) { alert('❌ Rejection failed: ' + (error.message||error)); }
  };

  /* ---------------- Admin list render ---------------- */
  window.renderVolunteerApplicationsAdmin = function () {
    const el = document.getElementById('volunteerApplicationsAdmin');
    if (!el) return;
    const list = window.volunteerApplications || [];
    const pending = getPendingQueue();
    let html = '';
    if (pending.length) {
      html += '<div class="result warning"><b>' + pending.length + ' application(s) saved on this device, waiting to sync to the cloud.</b></div>';
    }
    if (!list.length && !pending.length) {
      html = '<p>No volunteer applications yet.</p>' + (window.kumbhFirebaseReady ? '' : '<p><b>Connecting to Firebase...</b></p>');
    } else {
      html += list.map(a => {
        const status = String(a.status||'PENDING').toUpperCase();
        let action = '';
        if (status === 'PENDING') {
          action = '<div class="grid"><button class="green" type="button" onclick="window.krApproveVolunteer('+JSON.stringify(a.id)+')">APPROVE & ISSUE TEMP ID</button>'
                 + '<button class="red" type="button" onclick="window.krRejectVolunteer('+JSON.stringify(a.id)+')">REJECT</button></div>';
        } else if (status === 'APPROVED') {
          action = '<p><b>Volunteer ID:</b> ' + (a.volunteerId||a.tempId||'Not generated') + '<br><b>Temporary password:</b> ' + (a.tempPassword||'Not generated') + '</p>';
        } else if (status === 'REJECTED') {
          action = '<p><b>Application rejected.</b></p>';
        }
        return '<div class="application"><b>'+(a.name||'Volunteer')+'</b> <span class="status-'+status+'">'+status+'</span><br>'
          + '📞 '+(a.phone||'')+'<br>📧 '+(a.email||'')+'<br>📍 '+(a.area||'')+'<br>Role: '+(a.role||'')+'<br>'
          + '<small>'+(a.reason||'')+'</small><p><b>Verification:</b> '+(a.verificationStatus||'PENDING')+'</p>'+action+'</div>';
      }).join('');
    }
    el.innerHTML = html;
  };

  try {
    if (typeof renderOwnerDashboard === 'function') {
      const originalOwnerDashboard = renderOwnerDashboard;
      window.renderOwnerDashboard = function(){ originalOwnerDashboard(); setTimeout(window.renderVolunteerApplicationsAdmin, 50); };
    }
  } catch(e){}

  console.log('Kumbh Rakshak: Firebase volunteer sync active (with status badge + timeout + retry queue).');
})();
</script>
<!-- END FIREBASE REAL-TIME VOLUNTEER SYNC -->
